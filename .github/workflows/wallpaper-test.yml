name: Wallpaper Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Apply wallpaper test changes (build workspace only)
        shell: python
        run: |
          import base64, json
          from pathlib import Path
          files = json.loads(base64.b64decode(""))
          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install build tools
        run: sdkmanager "build-tools;36.0.0" "ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew :androidApp:assembleFossDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2
      - uses: actions/upload-artifact@v4
        with:
          name: Kai-Wallpaper-Test-APK
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
